    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <title>Smaregi Project Management</title>
    <script>
      // Áp class .dark trước khi React mount để tránh nháy sáng→tối khi F5.
      // Phải khớp logic với src/shared/hooks/use-theme.tsx.
      ;(() => {
        try {
          const stored = localStorage.getItem('smaregi-pm.theme')
          const isDark =
            stored === 'dark' ||
            ((stored === 'system' || !stored) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        } catch {
          /* localStorage bị chặn — bỏ qua, React sẽ tự xử lý */
        }
      })()
    </script>
